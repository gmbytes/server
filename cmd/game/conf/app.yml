# 游戏服务器配置文件

# Gate 网关配置
Gate:
  # 新配置（推荐）：TCP / WebSocket 可同时开启
  TcpListenHost: "0.0.0.0"   # TCP 监听地址
  TcpListenPort: 61101        # TCP 监听端口，0 表示关闭
  WsListenHost: "0.0.0.0"     # WebSocket 监听地址
  WsListenPort: 8080          # WebSocket 监听端口，0 表示关闭
  WsPath: "/ws"               # WebSocket 升级路径

  # 旧配置（兼容）：仅在新配置都未启用时生效
  # ServerType: "websocket"   # "tcp" / "websocket"
  # Host: "0.0.0.0"
  # Port: 8080

# Node 节点配置
Node:
  LocalIP: "127.0.0.1"              # 内网 IP，用于判断 RPC 连接是否是本地
  ProfileListenHost: ""             # Profile 监听地址，为空表示不监听
  ProfileListenMinPort: 0           # Profile 监听动态最小端口
  ProfileListenMaxPort: 0           # Profile 监听动态最大端口
  HttpKeepAliveSeconds: 60          # HTTP 服务保活时间（秒）
  HttpTimeoutSeconds: 30            # HTTP 服务超时时间（秒）
  HttpDebug: false                  # HTTP 是否为调试模式
  BootName: "Game"                  # 启动节点名
  Nodes:
    Game:
      Order: 1                      # 节点顺序
      Host: ""                      # 节点主机名，为空则使用 LocalIP
      Port: 0                       # 节点 TCP 端口（0 表示自动分配）
      HttpPort: 0                   # 节点 HTTP 端口（0 表示自动分配）
      UseHttps: false               # 是否使用 HTTPS
      Services:                     # 节点包含的服务（留空则使用自动注册的所有服务）
        - DB
        - Gate
        - Game
        - Zone


# Host 主机配置
Host:
  StartWaitTimeoutSeconds: 5        # 启动等待超时时间（秒）
  StopWaitTimeoutSeconds: 8         # 停止等待超时时间（秒）

# Log 日志配置
Log:
  # Compound 复合日志处理器配置
  Compound:
    NodeId: 0                       # 日志节点 ID
    NodeName: ""                    # 日志节点名
  
  # Console 控制台日志处理器配置
  Console:
    Formatter: "Color"              # 日志格式化器: "Default" 或 "Color"
    FileLineLevel: 4                # 文件行号显示级别（0=TRACE, 1=DEBUG, 2=INFO, 3=WARN, 4=ERROR, 5=FATAL）
    FileLineSkip: 6                 # 调用栈跳过层数
    ErrorLevel: 4                   # 错误级别（ERROR 及以上输出到 stderr）
    Filter: {}                      # 路径过滤配置: "路径前缀": 级别
    DefaultLevel: 1                 # 默认日志级别（0=TRACE, 1=DEBUG, 2=INFO, 3=WARN, 4=ERROR, 5=FATAL）
  
  # File 文件日志处理器配置
  File:
    LogPath: "logs"                 # 日志文件路径
    MaxLogChanLength: 10000         # 日志通道最大长度
    Formatter: "Default"            # 日志格式化器
    FileLineLevel: 4                # 文件行号显示级别
    FileLineSkip: 6                 # 调用栈跳过层数
    Filter: {}                      # 路径过滤配置
    DefaultLevel: 1                 # 默认日志级别
    FileNameFormat: "%Y_%M_%D_%h_%m_%i"  # 文件名格式（时间戳格式）
    FileRollingMegabytes: 100       # 文件滚动大小（MB）
    FileRollingIntervalSeconds: 3600 # 文件滚动间隔（秒）
    Compress: true                  # 是否压缩归档文件
