# 机器人压测配置

# RobotMgr 配置
RobotMgr:
  GateAddr: "127.0.0.1:61101"    # Gate 的 TCP 地址
  RobotCount: 10                  # 启动时自动创建的机器人数量

# Node 节点配置
Node:
  LocalIP: "127.0.0.1"
  BootName: "Robot"
  Nodes:
    Robot:
      Order: 1
      Services:
        - RobotMgr

# Host 主机配置
Host:
  StartWaitTimeoutSeconds: 5
  StopWaitTimeoutSeconds: 8

# Log 日志配置
Log:
  Console:
    Formatter: "Color"
    DefaultLevel: 1               # DEBUG
